# cargo-nextest configuration for oxide-sloc
# https://nexte.st/docs/configuration/

# ── Default profile ───────────────────────────────────────────────────────────
[profile.default]
# Show all test output on failure (not just the last N lines).
failure-output = "immediate-final"
# Report flaky tests (pass on retry) as distinct from clean passes.
final-status-level = "flaky"

# ── CI profile ────────────────────────────────────────────────────────────────
# Used by the Jenkinsfile:  cargo nextest run --profile ci
# Writes a JUnit XML file into the profile store dir (target/nextest/ci/junit.xml);
# the Jenkinsfile moves it to <OUTPUT_SUBDIR>/test-results/junit.xml for archiving
# and the junit() step.
[profile.ci]
# Run the whole suite even after a failure so the JUnit report is complete.
# This governs GitLab's `cargo nextest run --profile ci` (it passes no fail-fast
# flag, so the config wins). Jenkins passes an explicit --fail-fast/--no-fail-fast
# flag which overrides this, so the setting is inert there.
fail-fast = false
# Parallelism: match available CPU count (fast on multi-core agents).
test-threads = "num-cpus"
# Show output of failing tests immediately and in the final summary.
failure-output = "immediate-final"
# Track flaky tests separately from hard failures.
final-status-level = "flaky"
# Retry transient failures once before marking as failed.
retries = 1

# JUnit XML output — consumed by the Jenkins junit() step.
# `path` is relative to the profile store dir, so nextest writes it to
# target/nextest/ci/junit.xml (NOT the workspace root). The Jenkinsfile moves it
# into <OUTPUT_SUBDIR>/test-results/ after the test run completes.
[profile.ci.junit]
path = "junit.xml"
# Embed test stdout/stderr in the XML so Jenkins shows it in the test detail view.
store-success-output = false
