---
# oxide-sloc GitLab CI/CD
#
# Mirrors the same pipeline stages as Jenkinsfile and .github/workflows/ci.yml.
# Requires a runner with bash and curl; Rust is installed on first run and
# cached via the .cargo / .rustup directories.
#
# Usage:
#   1. Push this file to the root of your repo.
#   2. GitLab will auto-detect it and run the pipeline on every push.

# Use the official Rust image (pinned by digest) instead of curl|sh rustup install (FIND-014).
# To update the digest: docker pull rust:slim && docker inspect --format '{{index .RepoDigests 0}}' rust:slim
image: rust:slim@sha256:81099830a1e1d244607b9a7a30f3ff6ecadc52134a933b4635faba24f52840c9

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTUP_HOME: "${CI_PROJECT_DIR}/.rustup"
  PATH: "${CI_PROJECT_DIR}/.cargo/bin:${PATH}"
  RUST_LOG: "warn"
  OUT_DIR: "ci-out"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/
    - .rustup/
    - target/
    - vendor/

before_script:
  - apt-get update -qq && apt-get install -y -qq build-essential pkg-config libssl-dev ca-certificates
  - rustup show
  # For air-gapped runners: place vendor.tar.xz in the workspace before the job runs.
  # Internet-connected runners download crates from crates.io via cargo's built-in caching.
  - |
    if [ -f vendor.tar.xz ] && [ ! -d vendor ]; then
      echo "Verifying vendor.tar.xz integrity..."
      sha256sum -c vendor.tar.xz.sha256
      echo "Decompressing vendor.tar.xz..."
      tar -xJf vendor.tar.xz
      mkdir -p .cargo
      printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "vendor"\n' > .cargo/config.toml
    fi

stages:
  - quality
  - build
  - smoke
  - archive
  - publish

# ── Quality gates ─────────────────────────────────────────────────────────────

fmt:
  stage: quality
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: quality
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

test:
  stage: quality
  script:
    - cargo test --workspace --all-features

# ── Build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  script:
    - cargo build --release -p oxide-sloc
  artifacts:
    paths:
      - target/release/oxide-sloc
    expire_in: 1 hour

# ── CLI smoke tests ───────────────────────────────────────────────────────────
#
# Each job below maps to a specific web UI configuration path:
#
#   Web UI step 1: choose project path     → CLI positional arg
#   Web UI step 2: mixed-line policy       → --mixed-line-policy
#   Web UI step 2: python docstrings       → enabled by default (no flag)
#   Web UI step 3: output formats          → --json-out / --html-out / --pdf-out
#   Web UI step 4: run                     → execute the binary

smoke:plain:
  stage: smoke
  needs: [build]
  script:
    - ./target/release/oxide-sloc analyze testing/fixtures/basic --plain

smoke:per-file:
  stage: smoke
  needs: [build]
  script:
    - ./target/release/oxide-sloc analyze testing/fixtures/basic --per-file --plain

smoke:reports:
  stage: smoke
  needs: [build]
  script:
    - mkdir -p "${OUT_DIR}"
    - |
      ./target/release/oxide-sloc analyze testing/fixtures/basic \
        --report-title "GitLab CI run ${CI_PIPELINE_IID}" \
        --json-out "${OUT_DIR}/result.json" \
        --html-out "${OUT_DIR}/report.html"
    - test -s "${OUT_DIR}/result.json"
    - test -s "${OUT_DIR}/report.html"
    - grep -q "OxideSLOC" "${OUT_DIR}/report.html"
  artifacts:
    paths:
      - ci-out/
    expire_in: 7 days

smoke:re-render:
  stage: smoke
  needs: [smoke:reports]
  script:
    - |
      ./target/release/oxide-sloc report "${OUT_DIR}/result.json" \
        --html-out "${OUT_DIR}/re-rendered.html"
    - test -s "${OUT_DIR}/re-rendered.html"

smoke:pdf:
  stage: smoke
  needs: [smoke:reports]
  script:
    - |
      ./target/release/oxide-sloc report "${OUT_DIR}/result.json" \
        --pdf-out "${OUT_DIR}/re-rendered.pdf"
    - test -s "${OUT_DIR}/re-rendered.pdf"

smoke:policies:
  stage: smoke
  needs: [build]
  script:
    - |
      for policy in code-only code-and-comment comment-only separate-mixed-category; do
        echo "--- policy: $policy ---"
        ./target/release/oxide-sloc analyze testing/fixtures/basic \
          --plain --mixed-line-policy "$policy"
      done

smoke:web-ui:
  stage: smoke
  needs: [build]
  script:
    - ./target/release/oxide-sloc serve &
    - SERVER_PID=$!
    - sleep 4
    - HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4317/ || echo "000")
    - kill "${SERVER_PID}" 2>/dev/null || true
    - wait "${SERVER_PID}" 2>/dev/null || true
    - '[ "${HTTP_CODE}" = "200" ] || (echo "Web UI returned HTTP ${HTTP_CODE}" && exit 1)'

# ── Archive ───────────────────────────────────────────────────────────────────

archive:
  stage: archive
  needs: [smoke:reports]
  script:
    - echo "Artifacts already uploaded by smoke:reports job."
  artifacts:
    paths:
      - target/release/oxide-sloc
      - ci-out/
    expire_in: 30 days

# ── Publish to Nexus ──────────────────────────────────────────────────────────
#
# Pushes all build artifacts to a Sonatype Nexus Repository Manager instance.
# This job is triggered automatically when NEXUS_REPO_URL is set; otherwise it
# is available as a manual action.
#
# Required GitLab CI/CD variables (Settings → CI/CD → Variables, masked):
#   NEXUS_REPO_URL    Base URL of the Nexus instance, e.g. https://nexus.example.com
#   NEXUS_USER        Nexus username
#   NEXUS_PASS        Nexus password or token  ← mask this variable
#
# Optional variables:
#   NEXUS_REPO_NAME          Raw-format repository name (default: sloc-raw-hosted)
#   NEXUS_REPO_PATH          Upload path prefix
#                            (default: oxide-sloc/<project>/<pipeline-iid>)
#   NEXUS_VERSION            "nexus2" for Nexus Repository Manager 2 (default: nexus = NRM 3)
#   NEXUS_GENERATE_MANIFEST  Set to "true" to upload a checksums.sha256 manifest

nexus:push:
  stage: publish
  needs:
    - job: archive
      artifacts: true
    - job: build
      artifacts: true
  rules:
    - if: '$NEXUS_REPO_URL'
      when: on_success
    - when: manual
      allow_failure: true
  script:
    - |
      if [ -z "${NEXUS_REPO_URL:-}" ]; then
        echo "NEXUS_REPO_URL is not set — nothing to push."
        exit 0
      fi

      # Collect all available artifacts into a single staging directory.
      STAGE_DIR="${CI_PROJECT_DIR}/nexus-upload"
      mkdir -p "${STAGE_DIR}"
      FILES_TO_PUSH=""

      stage_file() {
        local src="$1" dst_name="$2"
        if [ -f "${src}" ]; then
          cp "${src}" "${STAGE_DIR}/${dst_name}"
          FILES_TO_PUSH="${FILES_TO_PUSH} ${dst_name}"
          echo "  staged: ${dst_name}"
        fi
      }

      echo "Staging artifacts…"
      stage_file "target/release/oxide-sloc"    "oxide-sloc"
      stage_file "ci-out/result.json"            "result.json"
      stage_file "ci-out/report.html"            "report.html"
      stage_file "ci-out/re-rendered.html"       "re-rendered.html"
      stage_file "ci-out/re-rendered.pdf"        "re-rendered.pdf"

      FILES_TO_PUSH="${FILES_TO_PUSH# }"

      if [ -z "${FILES_TO_PUSH}" ]; then
        echo "No artifact files found to push — skipping."
        exit 0
      fi

      ARTIFACT_REPO_TYPE="${NEXUS_VERSION:-nexus}" \
      ARTIFACT_REPO_URL="${NEXUS_REPO_URL}" \
      ARTIFACT_REPO_PATH="${NEXUS_REPO_PATH:-oxide-sloc/${CI_PROJECT_NAME}/${CI_PIPELINE_IID}}" \
      ARTIFACT_REPO_EXTRA="${NEXUS_REPO_NAME:-sloc-raw-hosted}" \
      ARTIFACT_REPO_USER="${NEXUS_USER:-}" \
      ARTIFACT_REPO_PASS="${NEXUS_PASS:-}" \
      ARTIFACT_DIR="${STAGE_DIR}" \
      ARTIFACT_FILES="${FILES_TO_PUSH}" \
      ARTIFACT_GENERATE_MANIFEST="${NEXUS_GENERATE_MANIFEST:-false}" \
      bash ci/artifact-push.sh
