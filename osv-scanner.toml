# osv-scanner / OpenSSF Scorecard vulnerability suppressions.
#
# Both advisories below enter the tree solely via `printpdf 0.9.1` (the latest
# published release), which pins `lopdf = "0.39.0"` and pulls
# `allsorts -> ouroboros -> proc-macro-error`. There is no newer printpdf and no
# compatible lopdf upgrade, so neither is fixable upstream today. They are
# already ignored in cargo-audit (ci.yml) and cargo-deny (deny.toml) with the
# same rationale; this file mirrors that for OSV-based scanners.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0187"
reason = "lopdf is used write-only via printpdf for PDF generation; the deeply-nested-PDF parser DoS is unreachable. printpdf 0.9.1 pins lopdf 0.39, so the >=0.42 fix is not available upstream."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error is an unmaintained build-time-only transitive dep of printpdf (via allsorts/ouroboros). No safe upgrade path exists; no runtime impact."
