name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt in ahead of the June 2026 forced migration

jobs:
  build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # required for SLSA provenance attestation and cosign OIDC signing

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Validate workspace structure
        run: |
          # Confirm every workspace crate directory exists and has a Cargo.toml.
          # A missing crate here means .dockerignore or a bad merge excluded it,
          # and the Docker build would fail with a cryptic manifest error.
          for crate in sloc-config sloc-languages sloc-core sloc-report sloc-web sloc-cli; do
            if [ ! -f "crates/${crate}/Cargo.toml" ]; then
              echo "ERROR: crates/${crate}/Cargo.toml is missing — workspace is incomplete"
              exit 1
            fi
          done
          # Confirm the vendor archive and its checksum are both present.
          if [ ! -f vendor.tar.xz ] || [ ! -f vendor.tar.xz.sha256 ]; then
            echo "ERROR: vendor.tar.xz or vendor.tar.xz.sha256 is missing"
            exit 1
          fi
          sha256sum -c vendor.tar.xz.sha256
          echo "Workspace structure OK"

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance: true is the default — SLSA build provenance attestations are generated
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image with cosign (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository }}@${DIGEST}"
          cosign sign --yes "${IMAGE_REF}"
