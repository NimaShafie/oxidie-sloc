[graph]
targets = []

[licenses]
# Suppress warnings for allowed licenses not present in the current dep graph
# (dep-graph composition changes between dependency bumps).
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
exceptions = [
  { allow = ["AGPL-3.0-or-later"], name = "oxide-sloc" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-config" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-core" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-languages" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-report" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-web" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-mcp" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known transitive dependency version splits — acceptable duplicates.
skip = [
  { name = "getrandom", version = "0.2" },
  { name = "getrandom", version = "0.3" },
  # getrandom 0.4 pulled by uuid ≥ 1.23 and tempfile ≥ 3.27 (via headless_chrome)
  { name = "getrandom", version = "0.4" },
  { name = "r-efi", version = "5" },
  { name = "windows-sys", version = "0.52" },
  { name = "windows-sys", version = "0.59" },
  # thiserror v1 (via prometheus→protobuf) and v2 (via headless_chrome) coexist
  { name = "thiserror", version = "1" },
  { name = "thiserror-impl", version = "1" },
  { name = "wit-bindgen", version = "0.51" },
]

[advisories]
version = 2
ignore = [
  # rustls-pemfile is unmaintained; no compatible replacement for rustls 0.23 yet.
  "RUSTSEC-2025-0134",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
