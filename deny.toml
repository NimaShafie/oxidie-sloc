[graph]
targets = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
exceptions = [
  { allow = ["AGPL-3.0-or-later"], name = "oxide-sloc" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-cli" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-config" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-core" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-languages" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-report" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-web" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-mcp" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known transitive dependency version splits — acceptable duplicates.
skip = [
  { name = "getrandom", version = "0.2" },
  { name = "getrandom", version = "0.3" },
  # getrandom 0.4 pulled by uuid ≥ 1.23 and tempfile ≥ 3.27 (via headless_chrome)
  { name = "getrandom", version = "0.4" },
  { name = "hashbrown", version = "0.15" },
  { name = "r-efi", version = "5" },
  { name = "windows-sys", version = "0.52" },
  { name = "windows-sys", version = "0.59" },
  { name = "windows-sys", version = "0.60" },
  { name = "windows-targets", version = "0.52" },
  { name = "windows_aarch64_gnullvm", version = "0.52" },
  { name = "windows_aarch64_msvc", version = "0.52" },
  { name = "windows_i686_gnu", version = "0.52" },
  { name = "windows_i686_gnullvm", version = "0.52" },
  { name = "windows_i686_msvc", version = "0.52" },
  { name = "windows_x86_64_gnu", version = "0.52" },
  { name = "windows_x86_64_gnullvm", version = "0.52" },
  { name = "windows_x86_64_msvc", version = "0.52" },
  { name = "wit-bindgen", version = "0.51" },
]

[advisories]
version = 2
ignore = [
  # protobuf 2.x pulled by prometheus 0.13 (no newer release); sloc-web only
  # generates metrics text output and never parses incoming protobuf payloads.
  "RUSTSEC-2024-0437",
  # rustls-pemfile is unmaintained; no compatible replacement for rustls 0.23 yet.
  "RUSTSEC-2025-0134",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
