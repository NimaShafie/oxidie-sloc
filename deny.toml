[graph]
targets = []

[licenses]
# Suppress warnings for allowed licenses not present in the current dep graph
# (dep-graph composition changes between dependency bumps).
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # BSD Zero Clause — more permissive than MIT, used by quoted_printable
  "0BSD",
  # Community Data License Agreement Permissive 2.0 — used by webpki-roots
  "CDLA-Permissive-2.0",
  # Boost Software License 1.0 — permissive, sometimes used without OR pairing
  "BSL-1.0",
  # The Unlicense — public domain dedication, sometimes used without OR pairing
  "Unlicense",
  # LGPL-2.1-or-later — appears in OR expressions (e.g. "MIT OR Apache-2.0 OR LGPL-2.1-or-later")
  # Listed here so it doesn't break if a crate ever uses it as its sole identifier
  "LGPL-2.1-or-later",
]
exceptions = [
  { allow = ["AGPL-3.0-or-later"], name = "oxide-sloc" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-config" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-core" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-languages" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-report" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-web" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-git" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-mcp" },
  # Transitive dep of headless_chrome (PDF generation); not distributed as a library.
  # cargo-deny (via askalono) identifies the GPLv3 file as GPL-3.0-or-later.
  { allow = ["GPL-3.0-or-later"], name = "auto_generate_cdp" },
]

# auto_generate_cdp uses license-file rather than an SPDX expression.
# cargo-deny (askalono) identifies the standard GPLv3 file as GPL-3.0-or-later.
# Hash computed with: python3 -c "import zlib,sys; print(hex(zlib.crc32(open(sys.argv[1],'rb').read())&0xffffffff))" vendor/auto_generate_cdp/LICENSE.txt
[[licenses.clarify]]
name = "auto_generate_cdp"
expression = "GPL-3.0-or-later"
license-files = [
  { path = "LICENSE.txt", hash = 0xba8ef827 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known transitive dependency version splits — acceptable duplicates.
skip = [
  { name = "getrandom", version = "0.2" },
  { name = "getrandom", version = "0.3" },
  # getrandom 0.4 pulled by uuid ≥ 1.23 and tempfile ≥ 3.27 (via headless_chrome)
  { name = "getrandom", version = "0.4" },
  { name = "r-efi", version = "5" },
  { name = "windows-sys", version = "0.52" },
  { name = "windows-sys", version = "0.59" },
  # thiserror v1 (via prometheus→protobuf) and v2 (via headless_chrome) coexist
  { name = "thiserror", version = "1" },
  { name = "thiserror-impl", version = "1" },
  { name = "wit-bindgen", version = "0.51" },
  # linux-raw-sys 0.4 (via rustix 0.38 → procfs → prometheus) and 0.12 (via rustix 1.x) coexist
  { name = "linux-raw-sys", version = "0.4" },
  { name = "linux-raw-sys", version = "0.12" },
]

[advisories]
version = 2
ignore = [
  # lopdf stack overflow when parsing deeply-nested PDF objects. oxide-sloc uses lopdf
  # write-only (PDF generation via printpdf) and never parses untrusted PDFs, so the
  # vulnerable parser path is unreachable. No published printpdf release depends on
  # lopdf >= 0.42 yet (0.9.1 pins ^0.39) — drop this once one does.
  { id = "RUSTSEC-2026-0187", reason = "lopdf used write-only via printpdf; parser DoS unreachable" },
  # proc-macro-error is an unmaintained build-time proc-macro dep pulled transitively by
  # printpdf 0.9 (allsorts -> ouroboros -> proc-macro-error). No safe upgrade is available;
  # it runs only at build time and ships nothing into the binary.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time transitive dep of printpdf; no safe upgrade" },
  # anyhow unsoundness in Error::downcast_mut(): UB only occurs when calling downcast_mut()
  # on an error that had context added via Error::context(). The workspace never calls
  # downcast_mut() on any anyhow error (verified across all crates), so the unsound path is
  # unreachable. Drop this once the vendored anyhow is bumped to a patched release.
  { id = "RUSTSEC-2026-0190", reason = "anyhow downcast_mut unsoundness unreachable; workspace never calls downcast_mut" },
  # ttf-parser is unmaintained, pulled transitively by printpdf 0.9 (allsorts font parsing).
  # No safe upgrade is available; same situation as the proc-macro-error advisory above.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained transitive dep of printpdf; no safe upgrade" },
  # quick-xml < 0.41 quadratic-runtime / unbounded-allocation DoS when parsing untrusted XML.
  # quick-xml enters the tree only via wayland-scanner (proc-macro) -> wayland-client -> rfd
  # (native file-dialog dep), where it parses trusted Wayland protocol XML at build time only,
  # never attacker-controlled runtime input. wayland-scanner 0.31.10 (latest, pinned by rfd
  # 0.17.2) requires quick-xml ^0.39, so it cannot be upgraded without replacing the file-dialog
  # stack. Drop these once rfd's wayland deps advance to a quick-xml >= 0.41 release.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml DoS unreachable; build-time trusted Wayland XML via rfd; no safe upgrade" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml DoS unreachable; build-time trusted Wayland XML via rfd; no safe upgrade" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
