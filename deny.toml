[graph]
targets = []

[licenses]
# Suppress warnings for allowed licenses not present in the current dep graph
# (dep-graph composition changes between dependency bumps).
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # BSD Zero Clause — more permissive than MIT, used by quoted_printable
  "0BSD",
  # Community Data License Agreement Permissive 2.0 — used by webpki-roots
  "CDLA-Permissive-2.0",
  # Boost Software License 1.0 — permissive, sometimes used without OR pairing
  "BSL-1.0",
  # The Unlicense — public domain dedication, sometimes used without OR pairing
  "Unlicense",
  # LGPL-2.1-or-later — appears in OR expressions (e.g. "MIT OR Apache-2.0 OR LGPL-2.1-or-later")
  # Listed here so it doesn't break if a crate ever uses it as its sole identifier
  "LGPL-2.1-or-later",
]
exceptions = [
  { allow = ["AGPL-3.0-or-later"], name = "oxide-sloc" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-config" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-core" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-languages" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-report" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-web" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-mcp" },
  # Transitive dep of headless_chrome (PDF generation); not distributed as a library
  { allow = ["GPL-3.0-only"], name = "auto_generate_cdp" },
]

# auto_generate_cdp uses license-file rather than an SPDX expression.
# cargo-deny needs the hash of the file to confirm the identified expression.
# Hash computed with: python3 -c "import zlib,sys; print(hex(zlib.crc32(open(sys.argv[1],'rb').read())&0xffffffff))" vendor/auto_generate_cdp/LICENSE.txt
[[licenses.clarify]]
name = "auto_generate_cdp"
expression = "GPL-3.0-only"
license-files = [
  { path = "LICENSE.txt", hash = 0xba8ef827 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known transitive dependency version splits — acceptable duplicates.
skip = [
  { name = "getrandom", version = "0.2" },
  { name = "getrandom", version = "0.3" },
  # getrandom 0.4 pulled by uuid ≥ 1.23 and tempfile ≥ 3.27 (via headless_chrome)
  { name = "getrandom", version = "0.4" },
  { name = "r-efi", version = "5" },
  { name = "windows-sys", version = "0.52" },
  { name = "windows-sys", version = "0.59" },
  # thiserror v1 (via prometheus→protobuf) and v2 (via headless_chrome) coexist
  { name = "thiserror", version = "1" },
  { name = "thiserror-impl", version = "1" },
  { name = "wit-bindgen", version = "0.51" },
]

[advisories]
version = 2
ignore = [
  # rustls-pemfile is unmaintained; no compatible replacement for rustls 0.23 yet.
  "RUSTSEC-2025-0134",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
